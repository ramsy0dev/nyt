[tool.poetry]
name = "nyt"
version = "0.1.2"
description = "Stop wasting time on YouTube"
authors = ["ramsy0dev"]
license = "GPL-3.0"
readme = "README.md"
packages = [
    {include = "nyt"}
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
yt-dlp = "^2024.5.27"
pytubefix = "^8.0.0"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
loguru = "^0.7.0"
requests = "^2.31.0"

[tool.poetry.plugins."console_scripts"]
nyt = "nyt:cli.run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
