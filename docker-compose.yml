services:
  nyt:
    build: .
    ports:
      - "9473:9473"
    volumes:
      # Named volume — data persists across rebuilds and container restarts.
      # To use a host directory instead (easier to inspect):
      #   - ./data:/root/.nyt
      - nyt-data:/root/.nyt
    restart: unless-stopped
    # Override the watcher interval (default: 60 min) or port:
    # command: ["nyt", "serve", "--host", "0.0.0.0", "--port", "9473", "--delay", "60"]

volumes:
  nyt-data:
