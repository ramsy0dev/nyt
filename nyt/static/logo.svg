<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 74"
     role="img"
     aria-label="nyt — No YouTube">
  <defs>
    <!--
      Turbulence displacement: gives every stroke a slight
      hand-drawn wobble without destroying legibility.
    -->
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032"
                    numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         scale="2.4"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- ── Frame + letterforms (all displaced together) ─────────────── -->
  <g filter="url(#rough)"
     fill="none" stroke="#fffdf8"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Open bracket frame
         Top-right and bottom-right are left open with short stubs,
         matching the original logo's bracket concept. -->
    <g stroke-width="4.5">
      <!-- Left side -->
      <path d="M 8,57 C 7,44 9,28 8,8"/>
      <!-- Top -->
      <path d="M 8,8 C 58,6 112,7 162,8"/>
      <!-- Bottom -->
      <path d="M 8,57 C 58,59 112,58 162,57"/>
      <!-- Top-right stub -->
      <path d="M 162,8 C 162,12 163,16 162,21"/>
      <!-- Bottom-right stub -->
      <path d="M 162,57 C 162,53 163,49 162,44"/>
    </g>

    <!-- ── n ──────────────────────────────────────────────────────── -->
    <g stroke-width="5">
      <!-- Left stem: top of x-height down to baseline -->
      <path d="M 22,19 C 21,31 22,42 22,53"/>
      <!-- Arch starting ~1/3 down the stem, curving over the top
           and descending as the right stem -->
      <path d="M 22,27 C 25,13 64,11 64,24
               C 64,36 63,44 63,53"/>
    </g>

    <!-- ── y ──────────────────────────────────────────────────────── -->
    <g stroke-width="5">
      <!-- Left arm and tail (descends below frame baseline) -->
      <path d="M 74,19 C 80,29 88,40 94,51
               C 92,59 90,65 88,70"/>
      <!-- Right arm meets junction at (94,51) -->
      <path d="M 114,19 C 108,29 100,40 94,51"/>
    </g>

    <!-- ── t ──────────────────────────────────────────────────────── -->
    <g stroke-width="5">
      <!-- Stem (taller than x-height, slightly leaning) -->
      <path d="M 139,10 C 138,25 138,40 137,55"/>
      <!-- Crossbar -->
      <path d="M 124,31 C 134,29 146,29 160,31"/>
    </g>
  </g>

  <!-- ── "No" badge: coral circle with diagonal strike
       Placed outside the displacement filter so it stays crisp
       as a clean accent against the sketchy lettering. ─────────── -->
  <g fill="none" stroke="#f4845f" stroke-linecap="round" stroke-width="2.8">
    <circle cx="184" cy="12" r="8.5"/>
    <line x1="178" y1="5" x2="190" y2="19"/>
  </g>
</svg>
